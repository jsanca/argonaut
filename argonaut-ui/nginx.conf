server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser-visible same-origin routes only; no Docker hostnames or secrets.
    location = /config/frameworks.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location /api/frameworks/spring-ai/ {
        proxy_pass http://argonaut-spring-ai:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/frameworks/langchain4j/ {
        proxy_pass http://argonaut-langchain4j:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/frameworks/langgraph4j/ {
        proxy_pass http://argonaut-langgraph4j:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/frameworks/embabel/ {
        proxy_pass http://argonaut-embabel:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/frameworks/koog/ {
        proxy_pass http://argonaut-koog:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
